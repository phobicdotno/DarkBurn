# Format, lints and tests on Windows, Linux and macOS. Runs on every push to main and on every
# pull request. It can also be started by hand (Actions > ci > Run workflow), for all systems
# or for one. release.yml runs these same jobs before it drafts a release for a tag.
# Nothing is published from here.
#
# While the repository is private, a push or a pull request leaves macOS out. A private
# repository has a small monthly allowance of runner time, and macOS uses it up fastest.
# A run by hand and the tests of a tag still run macOS. The workflow reads this from GitHub
# itself: once the repository is public, every run has all three systems.
name: ci

on:
  push:
    branches: [main]
    # Not for a push that changes only the front page or the documents: nothing that is built
    # or tested reads them. The one exception is docs/PARITY-CHECKLIST.md, which is built into
    # darkburn-mcp. Other .md files stay in, because some are built in or packaged.
    paths: ["**", "!README.md", "!docs/**", "docs/PARITY-CHECKLIST.md"]
  # No paths here. A check that is required for merging must report on every pull request,
  # and one that is filtered away never does.
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: Run the lints and tests on one system only
        type: choice
        options: [all, windows, linux, macos]
        default: all
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run that is under way. A run
# started by hand does not get in the way of one started by a push, and two runs by hand for
# different systems do not get in each other's way. The tests of a tag (started by
# release.yml) are never cancelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.only || 'all' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Test programs without debug information are many times smaller, and a runner's disk is small.
  CARGO_PROFILE_DEV_DEBUG: "0"

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The same test as in the matrix of the job below.
      - name: Say that macOS is left out
        if: github.event.repository.private && github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        run: echo "::notice title=No macOS in this run::The repository is private, so a push or a pull request does not run the macOS tests. Start them by hand with Actions, ci, Run workflow, only macos."

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cargo fmt reads the workspace, and the workspace reaches for ../solidcraft.
      - uses: ./.github/actions/prepare
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt -- --check

  test:
    name: Clippy and tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        # The one system a run by hand asks for, else all three. While the repository is
        # private, a push or a pull request leaves macOS out (see the top of this file).
        system: ${{ fromJSON((inputs.only || 'all') != 'all' && format('["{0}"]', inputs.only) || (github.event.repository.private && github.event_name != 'workflow_dispatch' && github.ref_type != 'tag') && '["windows", "linux"]' || '["windows", "linux", "macos"]') }}
    # macOS is an Apple silicon runner: its GPU (Metal) draws the UI tests. This job is new.
    # macOS has never been built or tested before and this job has not been seen green yet,
    # so expect to fix things after its first runs. It is not allowed to fail quietly.
    runs-on: ${{ matrix.system == 'windows' && 'windows-2025' || matrix.system == 'linux' && 'ubuntu-24.04' || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # libclang: the camera crate makes its Linux bindings with it while building.
      # mesa-vulkan-drivers: a GPU in software (lavapipe). The UI tests draw the real app
      # offscreen and need a GPU; a runner has none. No display is needed.
      # Fonts: a few tests read the system's fonts.
      - name: Install what the Linux build and tests need
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-liberation

      - uses: ./.github/actions/prepare
        with:
          components: clippy
          cache-key: ci-${{ matrix.system }}

      - name: Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The tests are built and run when clippy has something to say too, so one run shows both.
      - name: Build the tests
        id: build-tests
        if: ${{ !cancelled() && steps.clippy.conclusion != 'skipped' }}
        run: cargo test --workspace --locked --no-run

      # Everything is built by now, so this step is the tests alone and takes a few minutes.
      # A test that hangs is stopped here, long before the limit of the whole job.
      - name: Tests
        if: ${{ !cancelled() && steps.build-tests.conclusion == 'success' }}
        timeout-minutes: 30
        run: cargo test --workspace --locked
