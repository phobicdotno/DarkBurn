[package]
name = "darkburn"
description = "DarkBurn laser cutter and engraver"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except unsafe_code: denied, not forbidden, so that src/native_frame.rs
# (Windows resize border, taskbar icon) can allow it. Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[features]
# Live webcam capture only opens after the user turns it on, picks a camera and presses Start.
# Real USB serial ports for GRBL machines: listing ports, and opening one only when the user clicks Connect.
default = ["live-camera", "serial"]
live-camera = ["darkburn-vision/capture"]
# The same feature opens a Ruida controller's USB port (its FTDI chip shows up as a serial port).
serial = ["darkburn-grbl/serial", "darkburn-ruida/serial"]
# Ruida over raw FTDI USB, for systems where the FTDI chip has no serial driver. Not built by default.
usb = ["darkburn-ruida/usb"]

[dependencies]
darkburn-grbl = { path = "../../crates/darkburn-grbl" }
darkburn-ruida = { path = "../../crates/darkburn-ruida" }
darkburn-ui = { workspace = true }
darkburn-core = { workspace = true }
darkburn-geom = { workspace = true }
darkburn-text = { path = "../../crates/darkburn-text" }
darkburn-job = { path = "../../crates/darkburn-job" }
darkburn-raster = { path = "../../crates/darkburn-raster" }
darkburn-vision = { path = "../../crates/darkburn-vision" }
darkburn-import = { path = "../../crates/darkburn-import" }
darkburn-mcp = { path = "../../crates/darkburn-mcp" }
darkburn-gcodebots = { path = "../../crates/darkburn-gcodebots" }
darkburn-galvo = { path = "../../crates/darkburn-galvo" }
darkburn-mcc = { path = "../../crates/darkburn-mcc" }
kurbo = { workspace = true }
image = { workspace = true }
usvg = { workspace = true }
rfd = { package = "darkburn-dialogs", path = "../../crates/darkburn-dialogs" }
tiny-skia = { workspace = true }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
solidcraft-theme = { workspace = true }
solidcraft-ui-text = { workspace = true }
solidcraft-ui-registry = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
ron = { workspace = true }
# The update check (SHELL-13): HTTPS with rustls, certificates from the operating system.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
zip = { workspace = true }
# UI tests (src/ui_harness.rs): the real app in a headless egui harness, rendered offscreen with wgpu.
egui_kittest = { version = "=0.37.0", features = ["wgpu", "eframe"] }
