[package]
name = "darkburn-text"
description = "DarkBurn text: font outlines, SHX fonts, text on path, QR codes, barcodes and variable text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kurbo = "0.13.1"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
fontdb = "0.23.0"
unicode-bidi = "0.3.18"
i_overlay = "9.1.0"
qrcode = { version = "0.14.1", default-features = false }
datamatrix = "0.3.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
csv = "1.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
