# cargo-about configuration: THIRD-PARTY-LICENSES.txt is generated from the dependency tree by
#   cargo about generate --locked --workspace packaging/about.hbs -o THIRD-PARTY-LICENSES.txt
# (scripts/package-common.ps1 does this for the installer and the portable zip).
# Only permissive licences are accepted; a new dependency under another licence fails the build.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MIT-0",
    "Ubuntu-font-1.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]
targets = ["x86_64-pc-windows-msvc"]

# hidapi is MIT, but on macOS it compiles the HIDAPI C library it bundles (etc/hidapi, version
# 0.15.0) into the program. That library is offered under GPL v3, a BSD-style licence or the
# original HIDAPI licence, at the user's choice; DarkBurn takes the BSD-style licence (see
# ATTRIBUTION.md). The list names both, with the C library's own BSD text, on every target:
# cargo about has no per-target setting, and on Linux and Windows no C code of it is built.
# The checksums are SHA-256 of the files in hidapi 2.6.7; a new hidapi version that changes
# either file stops cargo about until they are checked again.
[hidapi.clarify]
license = "MIT AND BSD-3-Clause"

[[hidapi.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "778d971f6152990cee1644e7aadcd51a68050dd73f76463c5a9c1863ca495d73"

[[hidapi.clarify.files]]
path = "etc/hidapi/LICENSE-bsd.txt"
license = "BSD-3-Clause"
checksum = "30eb1bef29b46f8ba7ab8b416035dbd93cb034a45481dd97815b944284582cd2"
